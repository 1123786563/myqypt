# T25 acceptance journey (Issue #26): the Platform stores only a
# secret_ref — never a Secret value — and the development environment
# commits no Secret to the repository. The journey drives the real
# service with the concrete in-process provider port and a recording
# evidence sink: the three input-shaped rejections (missing tenant,
# missing idempotency key, raw secret value) happen before the outbound
# port with zero evidence; the accepted delivery applies once and
# records one minimized evidence row; the replay converges onto the
# same resource with a single provider effect; an injected provider
# failure leaves no partial state and converges on retry; and the
# journey's own assembled fake secret material never appears in any
# git-tracked file (the dev-env no-committed-secret self-check).
# Values here are non-secret stable test identifiers only; no tokens,
# subjects, or credentials ever appear in this file.
id: t25-secret-reference
seam: lighthouse-secret-reference
timeout: 5m
inputs:
  tenant_id: 0199cd8e-6c9f-7cc0-9d34-6a2b5f01e88e
  idempotency_key: t25-acceptance
  secret_ref: provider-alpha/credential-1
assertions:
  - name: reject_missing_tenant
    want:
      error_class: err_tenant_required
      before_port: true
      evidence_rows: 0
  - name: reject_missing_idempotency_key
    want:
      error_class: err_idempotency_key_required
      before_port: true
      evidence_rows: 0
  - name: reject_raw_secret_value
    want:
      error_class: err_secret_ref_invalid
      before_port: true
      evidence_rows: 0
  - name: accepted_apply_once
    want:
      outcome: accepted
      provider_effects: 1
      evidence_rows: 1
  - name: replay_converges_single_effect
    want:
      same_resource: true
      outcome: duplicate
      provider_effects: 1
  - name: port_failure_no_partial_then_retry_converges
    want:
      failure_class: err_provider_unavailable
      evidence_after_failure: 0
      retry_outcome: accepted
  - name: evidence_content_minimized
    want:
      fields: key_resource_outcome_only
      secret_material_hits: 0
  - name: repo_hygiene_zero_secret_committed
    want:
      git_tracked_hits: 0
