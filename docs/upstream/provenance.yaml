        web/src/styles/app.css; zero verbatim copy.
      - >-
        Component conventions (composition over configuration, cva-based
        variant APIs, data-slot markers, cn() class merging) applied to
        authored components; zero verbatim copy.
  - name: go-admin
    repository: https://github.com/go-admin-team/go-admin
    commit: 1b7dcd843ce38fddc8c280fe3139e02735cf7574
    license: MIT
    license_file: LICENSES/go-admin-MIT.txt
    extraction_mode: pattern-only
    destinations: []
    local_modifications:
      - >-
        Gin router and HTTP middleware composition (request ID, panic
        recovery, security response headers, CORS) adopted as ideas;
        re-authored for this repository; zero verbatim copy.
      - >-
        Cobra multi-command organization (platform-api / platform-worker /
        migrate / version command shapes) re-authored around an explicit
        composition root; zero verbatim copy.
      - >-
        Process startup discipline (HTTP server timeouts, signal listening and
        graceful shutdown, version-info injection, /livez and /readyz)
        re-authored; zero verbatim copy.
      - >-
        Object-storage Adapter approach (cloud object-storage adapters as
        environment-injected implementations behind an ObjectStore port)
        adopted as an idea; no cloud SDK or adapter code carried over; zero
        verbatim copy.
